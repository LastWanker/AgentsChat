[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphchat"
version = "0.1.0"
description = "GraphChat skeleton based on LangGraph/LangChain official patterns"
readme = "docs/README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0.10",
  "langgraph-checkpoint-sqlite>=3.0.3",
  "langchain>=0.3.0",
  "langchain-openai>=0.3.0",
  "langchain-deepseek>=0.1.0",
  "pydantic>=2.7.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
